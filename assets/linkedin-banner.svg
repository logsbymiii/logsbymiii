<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A"/>
      <stop offset="45%" stop-color="#12161A"/>
      <stop offset="100%" stop-color="#2D333B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A1A1AA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2D333B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#grid)" opacity="0.4"/>
  <rect width="700" height="396" fill="url(#glow)"/>

  <!-- Terminal window -->
  <g transform="translate(240, 38)">
    <rect x="0" y="0" width="1100" height="320" rx="14" fill="#08090A" stroke="#2D333B" stroke-width="2"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="1100" height="50" rx="14" fill="#12161A"/>
    <rect x="0" y="26" width="1100" height="24" fill="#12161A"/>
    <circle cx="32" cy="25" r="8" fill="#3A3F47"/>
    <circle cx="58" cy="25" r="8" fill="#3A3F47"/>
    <circle cx="84" cy="25" r="8" fill="#3A3F47"/>
    <text x="550" y="32" font-family="SF Mono, Consolas, monospace" font-size="16" fill="#6b7280" text-anchor="middle">helmi@dev — zsh</text>

    <!-- Terminal content -->
    <text x="40" y="98" font-family="SF Mono, Consolas, monospace" font-size="24" fill="#A1A1AA">$ whoami</text>

    <text x="40" y="148" font-family="SF Mono, Consolas, monospace" font-size="46" font-weight="700" fill="#E6E7E9">Helmi Mohammad Fajari</text>

    <text x="40" y="196" font-family="SF Mono, Consolas, monospace" font-size="24" fill="#A1A1AA">$ cat bio.txt</text>

    <text x="40" y="238" font-family="SF Mono, Consolas, monospace" font-size="23" fill="#A1A1AA">D-4 Business Information Systems Student at Polinema</text>
    <text x="40" y="272" font-family="SF Mono, Consolas, monospace" font-size="23" fill="#A1A1AA">Backend &amp; Automation <tspan fill="#3A3F47">|</tspan> DevOps Enthusiast</text>

    <!-- Blinking cursor -->
    <rect x="40" y="286" width="15" height="26" fill="#E6E7E9">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Decorative code brackets on the right -->
  <text x="1500" y="220" font-family="SF Mono, Consolas, monospace" font-size="90" fill="#2D333B" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
</svg>

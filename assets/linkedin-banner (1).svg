<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A"/>
      <stop offset="45%" stop-color="#12161A"/>
      <stop offset="100%" stop-color="#2D333B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A1A1AA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2D333B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#grid)" opacity="0.4"/>
  <rect width="700" height="396" fill="url(#glow)"/>

  <!-- Terminal window -->
  <g transform="translate(360, 68)">
    <rect x="0" y="0" width="1000" height="240" rx="10" fill="#08090A" stroke="#2D333B" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="1000" height="38" rx="10" fill="#12161A"/>
    <rect x="0" y="20" width="1000" height="18" fill="#12161A"/>
    <circle cx="26" cy="19" r="6" fill="#3A3F47"/>
    <circle cx="48" cy="19" r="6" fill="#3A3F47"/>
    <circle cx="70" cy="19" r="6" fill="#3A3F47"/>
    <text x="500" y="24" font-family="SF Mono, Consolas, monospace" font-size="13" fill="#6b7280" text-anchor="middle">helmi@dev — zsh</text>

    <!-- Terminal content -->
    <text x="32" y="72" font-family="SF Mono, Consolas, monospace" font-size="17" fill="#A1A1AA">$ whoami</text>

    <text x="32" y="106" font-family="SF Mono, Consolas, monospace" font-size="28" font-weight="700" fill="#E6E7E9">Helmi Mohammad Fajari</text>

    <text x="32" y="140" font-family="SF Mono, Consolas, monospace" font-size="17" fill="#A1A1AA">$ cat bio.txt</text>

    <text x="32" y="170" font-family="SF Mono, Consolas, monospace" font-size="16" fill="#A1A1AA">D-4 Business Information Systems Student at Polinema</text>
    <text x="32" y="194" font-family="SF Mono, Consolas, monospace" font-size="16" fill="#A1A1AA">Backend &amp; Automation <tspan fill="#3A3F47">|</tspan> DevOps Enthusiast</text>

    <!-- Blinking cursor -->
    <rect x="32" y="206" width="11" height="18" fill="#E6E7E9">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Decorative code brackets on the right -->
  <text x="1460" y="220" font-family="SF Mono, Consolas, monospace" font-size="120" fill="#2D333B" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
</svg>

    <text x="96" y="441" class="code">MALANG, ID</text>

    <rect x="250" y="388" width="156" height="76" rx="6" fill="#11151A" stroke="#2F363F"/>
    <text x="268" y="414" class="tiny">FOCUS</text>
    <text x="268" y="441" class="code">SYSTEMS</text>

    <rect x="422" y="388" width="168" height="76" rx="6" fill="#11151A" stroke="#2F363F"/>
    <text x="440" y="414" class="tiny">MINDSET</text>
    <text x="440" y="441" class="code">RELIABILITY</text>
  </g>

  <text x="78" y="507" class="small">CURRENT OBJECTIVE</text>
  <text x="78" y="538" class="body">Build systems that remove friction,</text>
  <text x="78" y="562" class="body">automate repetitive work, and stay reliable.</text>

  <line x1="78" y1="594" x2="590" y2="594" class="line"/>
  <text x="78" y="624" class="small">STATUS</text>
  <circle cx="142" cy="620" r="5" fill="#D1D5DB" filter="url(#glow)"/>
  <text x="156" y="624" class="code">BUILDING / LEARNING / SHIPPING</text>
  <text x="78" y="660" class="code"><tspan fill="#9CA3AF">$</tspan> _</text>

  <!-- RIGHT: CURRENTLY -->
  <text x="668" y="105" class="section">02 / CURRENTLY</text>
  <line x1="862" y1="99" x2="1352" y2="99" class="line"/>

  <text x="668" y="148" class="label">SYSTEMS</text>
  <text x="668" y="171" class="small">building around real operational problems</text>

  <!-- pipeline -->
  <g>
    <line x1="700" y1="222" x2="700" y2="482" stroke="#555E68" stroke-width="2" stroke-dasharray="3 7"/>
    <circle cx="700" cy="230" r="8" fill="#0D1117" stroke="#D1D5DB" stroke-width="2"/>
    <circle cx="700" cy="230" r="3" fill="#E5E7EB"/>
    <circle cx="700" cy="314" r="8" fill="#0D1117" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="700" cy="314" r="3" fill="#A1A1AA"/>
    <circle cx="700" cy="398" r="8" fill="#0D1117" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="700" cy="398" r="3" fill="#A1A1AA"/>
    <circle cx="700" cy="482" r="8" fill="#0D1117" stroke="#E5E7EB" stroke-width="2"/>
    <circle cx="700" cy="482" r="3" fill="#FFFFFF"/>

    <text x="730" y="221" class="tiny">01</text>
    <text x="766" y="221" class="label">REAL PROBLEM</text>
    <text x="766" y="244" class="small">understand the root</text>

    <text x="730" y="305" class="tiny">02</text>
    <text x="766" y="305" class="label">STRUCTURE</text>
    <text x="766" y="328" class="small">organize the chaos</text>

    <text x="730" y="389" class="tiny">03</text>
    <text x="766" y="389" class="label">AUTOMATION</text>
    <text x="766" y="412" class="small">remove repetitive work</text>

    <text x="730" y="473" class="tiny">04</text>
    <text x="766" y="473" class="label">RELIABILITY</text>
    <text x="766" y="496" class="small">make it consistent</text>
  </g>

  <text x="1045" y="148" class="label">INFRASTRUCTURE</text>
  <text x="1045" y="171" class="small">going deeper into systems</text>

  <!-- infra nodes -->
  <g>
    <rect x="1030" y="205" width="105" height="76" rx="7" fill="#12171D" stroke="#353C45"/>
    <rect x="1150" y="205" width="105" height="76" rx="7" fill="#12171D" stroke="#353C45"/>
    <rect x="1270" y="205" width="82" height="76" rx="7" fill="#12171D" stroke="#353C45"/>
    <text x="1082" y="237" text-anchor="middle" class="code">LINUX</text>
    <text x="1082" y="259" text-anchor="middle" class="tiny">kernel</text>
    <text x="1202" y="237" text-anchor="middle" class="code">DOCKER</text>
    <text x="1202" y="259" text-anchor="middle" class="tiny">containers</text>
    <text x="1311" y="237" text-anchor="middle" class="code">CI/CD</text>
    <text x="1311" y="259" text-anchor="middle" class="tiny">delivery</text>
    <path d="M1135 243H1150M1255 243H1270" stroke="#737B84" stroke-width="1.5"/>
  </g>

  <rect x="1030" y="307" width="322" height="174" rx="7" fill="url(#panel)" stroke="#353C45"/>
  <text x="1052" y="340" class="small">SYSTEM.STATUS</text>
  <circle cx="1058" cy="365" r="5" fill="#D1D5DB" filter="url(#glow)"/>
  <text x="1074" y="370" class="code">running /system.status</text>
  <line x1="1052" y1="390" x2="1330" y2="390" class="line"/>
  <text x="1052" y="421" class="body">works locally</text>
  <text x="1052" y="447" class="small">↓</text>
  <text x="1080" y="447" class="body">works reliably</text>

  <text x="1030" y="520" class="small">NEXT LAYER</text>
  <text x="1030" y="550" class="label">CLOUD INFRASTRUCTURE</text>
  <text x="1030" y="576" class="body">production-ready systems</text>
  <text x="1030" y="605" class="small">architecture · observability · scale</text>

  <!-- footer rail -->
  <line x1="48" y1="712" x2="1352" y2="712" class="line"/>
  <text x="48" y="738" class="tiny">01 / WHOAMI</text>
  <text x="700" y="738" class="tiny" text-anchor="middle">BUILD SYSTEMS · NOT JUST SOFTWARE</text>
  <text x="1352" y="738" class="tiny" text-anchor="end">02 / CURRENTLY</text>

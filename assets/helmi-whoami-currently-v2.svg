<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E12"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#090B0F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171C23"/>
      <stop offset="1" stop-color="#10141A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B949E"/>
      <stop offset="0.5" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#8B949E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#252B33" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 28px "Space Grotesk","Segoe UI",Arial,sans-serif; fill:#E5E7EB; letter-spacing:1px; }
      .section { font: 700 22px "Space Grotesk","Segoe UI",Arial,sans-serif; fill:#E5E7EB; letter-spacing:.7px; }
      .label { font: 700 16px "Space Grotesk","Segoe UI",Arial,sans-serif; fill:#F0F1F2; letter-spacing:.7px; }
      .body { font: 15px Inter,"Segoe UI",Arial,sans-serif; fill:#C4C9D0; }
      .code { font: 15px "JetBrains Mono","SFMono-Regular",Consolas,monospace; fill:#E5E7EB; }
      .small { font: 12px "JetBrains Mono","SFMono-Regular",Consolas,monospace; fill:#8B949E; }
      .tiny { font: 10px "JetBrains Mono","SFMono-Regular",Consolas,monospace; fill:#69717C; }
      .line { stroke:#30363D; stroke-width:1; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <rect width="1400" height="760" fill="url(#grid)" opacity=".45"/>

  <!-- ambient network -->
  <g opacity=".28" stroke="#7C858F" fill="none">
    <path d="M1010 70L1180 135L1315 85L1360 210L1235 270L1110 220Z"/>
    <path d="M1010 70L1110 220M1180 135L1235 270M1315 85L1235 270"/>
  </g>
  <g fill="#AAB1B9" opacity=".65">
    <circle cx="1010" cy="70" r="3"/><circle cx="1180" cy="135" r="3"/>
    <circle cx="1315" cy="85" r="3"/><circle cx="1360" cy="210" r="3"/>
    <circle cx="1235" cy="270" r="3"/><circle cx="1110" cy="220" r="3"/>
  </g>

  <!-- top rail -->
  <text x="48" y="38" class="small">logsbymiii / profile</text>
  <text x="1352" y="38" class="small" text-anchor="end">SYSTEMS · AUTOMATION · DEVOPS</text>
  <line x1="48" y1="55" x2="1352" y2="55" class="line"/>

  <!-- LEFT: WHOAMI -->
  <text x="48" y="105" class="section">01 / WHOAMI</text>
  <line x1="232" y1="99" x2="620" y2="99" class="line"/>

  <rect x="48" y="128" width="572" height="560" rx="8" fill="url(#panel)" stroke="#343B44"/>
  <rect x="48" y="128" width="572" height="42" rx="8" fill="#151A20"/>
  <line x1="48" y1="170" x2="620" y2="170" class="line"/>

  <circle cx="72" cy="149" r="5" fill="#69717C"/>
  <circle cx="90" cy="149" r="5" fill="#69717C"/>
  <circle cx="108" cy="149" r="5" fill="#69717C"/>
  <text x="334" y="154" class="tiny" text-anchor="middle">helmi@polinema — zsh</text>

  <text x="78" y="207" class="code"><tspan fill="#9CA3AF">$</tspan> whoami</text>
  <text x="78" y="242" class="code" fill="#FFFFFF">helmi@polinema</text>

  <line x1="78" y1="263" x2="590" y2="263" class="line"/>

  <text x="78" y="300" class="label">BUSINESS INFORMATION SYSTEMS</text>
  <text x="78" y="326" class="body">Backend &amp; Automation enthusiast</text>
  <text x="78" y="351" class="body">Exploring DevOps &amp; Cloud Infrastructure</text>

